<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d2b55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RDM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Dashboard RDM</title>
<style>
:root{--bg:#0b1a30;--card:#11284a;--ink:#f3f6fb;--ink2:#a9b8cf;--acc:#3987e5;--bad:#ff8a8a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 20% -10%,#1b4a8a 0,transparent 60%),var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:380px;background:rgba(17,40,74,.85);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#2a78d6,#0d2b55);display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-.02em;font-size:18px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
p{margin:0 0 20px;color:var(--ink2);font-size:14px}
label{display:block;font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;outline:none}
input[type=password]:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(57,135,229,.3)}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:14px;color:var(--ink2)}
button{width:100%;font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--acc);border:0;border-radius:12px;padding:13px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:10px}
.foot{font-size:12px;color:var(--ink2);margin-top:16px;text-align:center}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="logo">RDM</div>
  <h1>Dashboard RDM</h1>
  <p>Bandeirantes · Gestão da Informação<br>Acesso restrito. Digite a senha para abrir.</p>
  <label for="pw">Senha</label>
  <input type="password" id="pw" autocomplete="current-password" required autofocus>
  <div class="row"><input type="checkbox" id="lembrar" checked><label for="lembrar" style="margin:0;text-transform:none;letter-spacing:0;font-weight:500;font-size:14px">Manter conectado neste aparelho</label></div>
  <button id="btn" type="submit">Entrar</button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">Atualizado em 25/10/2026 12:00</div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(senha){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(senha),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  let html;
  if(P.gz){const ds=new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')));html=await ds.text();}
  else html=new TextDecoder().decode(buf);
  return html;
}
function mostrar(html){document.open();document.write(html);document.close();}
const st={get(){try{return localStorage.getItem('rdm-pw');}catch(e){return null;}},set(v){try{localStorage.setItem('rdm-pw',v);}catch(e){}},del(){try{localStorage.removeItem('rdm-pw');}catch(e){}}};
const f=document.getElementById('f'),err=document.getElementById('err'),btn=document.getElementById('btn');
if(!window.crypto||!crypto.subtle){err.textContent='Este navegador não suporta a abertura segura. Use o Safari, Chrome ou Edge atualizados.';btn.disabled=true;}
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Abrindo…';
  const s=document.getElementById('pw').value;
  const lembrar=document.getElementById('lembrar').checked;
  try{const html=await abrir(s);if(lembrar)st.set(s);else st.del();mostrar(html);}
  catch(x){btn.disabled=false;btn.textContent='Entrar';err.textContent='Senha incorreta.';}
});
const salva=st.get();
if(salva){btn.disabled=true;btn.textContent='Abrindo…';abrir(salva).then(mostrar).catch(()=>{st.del();btn.disabled=false;btn.textContent='Entrar';});}
